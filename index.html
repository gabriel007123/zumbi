<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zombie Survival</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080b0a;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
}

/* ==============================
   HUD
============================== */

#hud {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 10;

    background: rgba(0, 0, 0, 0.75);

    padding: 12px 16px;

    border-radius: 10px;

    border: 1px solid #52665a;

    color: white;

    font-size: 17px;

    line-height: 1.6;

    pointer-events: none;
}


/* ==============================
   BARRA DO BOSS
============================== */

#bossBar {
    position: fixed;
    top: 15px;
    left: 50%;

    transform: translateX(-50%);

    width: min(420px, 70vw);

    display: none;

    z-index: 10;

    text-align: center;
}

#bossName {
    color: #ff5252;

    font-size: 22px;

    font-weight: bold;

    text-shadow:
        0 0 10px red;

    margin-bottom: 5px;
}

#bossBarBackground {
    width: 100%;

    height: 22px;

    background: #250000;

    border: 2px solid #ff5252;

    border-radius: 10px;

    overflow: hidden;
}

#bossHealth {
    width: 100%;

    height: 100%;

    background:
        linear-gradient(
            90deg,
            #ff0000,
            #ff5722
        );
}


/* ==============================
   GAME OVER
============================== */

#gameOver {
    position: fixed;

    inset: 0;

    display: none;

    justify-content: center;

    align-items: center;

    flex-direction: column;

    background:
        rgba(0, 0, 0, 0.86);

    z-index: 20;

    color: white;
}

#gameOver h1 {
    color: #e53935;

    font-size: 64px;

    margin: 0 0 10px;

    text-shadow:
        0 0 20px red;
}

#gameOver p {
    font-size: 22px;
}

button {
    padding: 14px 28px;

    border: none;

    border-radius: 8px;

    background: #d32f2f;

    color: white;

    font-size: 18px;

    cursor: pointer;
}

button:hover {
    background: #f44336;
}

</style>

</head>

<body>


<!-- ==============================
     HUD
============================== -->

<div id="hud">

    ❤️ Vida:
    <span id="health">100</span>

    <br>

    🔫 Munição:
    <span id="ammo">30</span>

    <br>

    💣 Bombas:
    <span id="bombs">0</span>/3

    <br>

    🧟 Zumbis:
    <span id="zombies">0</span>

    <br>

    ⭐ Pontos:
    <span id="score">0</span>

    <br>

    🌊 Onda:
    <span id="wave">1</span>

</div>


<!-- ==============================
     BOSS
============================== -->

<div id="bossBar">

    <div id="bossName">
        ☠️ BOSS
    </div>

    <div id="bossBarBackground">

        <div id="bossHealth"></div>

    </div>

</div>


<!-- ==============================
     GAME OVER
============================== -->

<div id="gameOver">

    <h1>
        VOCÊ MORREU
    </h1>

    <p>

        Pontuação:
        <span id="finalScore">0</span>

    </p>

    <button onclick="restartGame()">
        Jogar novamente
    </button>

</div>


<canvas id="game"></canvas>


<script>

// ======================================================
// CANVAS
// ======================================================

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


function resizeCanvas() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;
}

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


// ======================================================
// IMAGENS
// ======================================================

const mapa = new Image();

mapa.src = "mapa.png";


const personagemImg = new Image();

personagemImg.src =
    "sukuna.webp";


const zombieImg = new Image();

zombieImg.src =
    "zombie.gif";


// ==============================
// IMAGEM DO BOSS
// ==============================

const bossImg = new Image();

bossImg.src =
    "boss.webp";


const pistolaImg = new Image();

pistolaImg.src =
    "csgo.webp";


// ======================================================
// DESENHAR MAPA
// ======================================================

function drawBackground() {

    if (
        !mapa.complete ||
        mapa.naturalWidth === 0
    ) {

        ctx.fillStyle =
            "#101713";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        return;
    }


    const escalaX =
        canvas.width /
        mapa.naturalWidth;


    const escalaY =
        canvas.height /
        mapa.naturalHeight;


    const escala =
        Math.max(
            escalaX,
            escalaY
        );


    const largura =
        mapa.naturalWidth *
        escala;


    const altura =
        mapa.naturalHeight *
        escala;


    const x =
        (
            canvas.width -
            largura
        ) / 2;


    const y =
        (
            canvas.height -
            altura
        ) / 2;


    ctx.drawImage(

        mapa,

        x,
        y,

        largura,
        altura
    );
}


// ======================================================
// JOGADOR
// ======================================================

const player = {

    x: canvas.width / 2,

    y: canvas.height / 2,

    radius: 18,

    speed: 4,

    health: 100,

    ammo: 30,

    maxAmmo: 30,

    reloadTime: 0,

    shootCooldown: 0
};


// ======================================================
// MOUSE
// ======================================================

const mouse = {

    x: canvas.width / 2,

    y: canvas.height / 2,

    down: false
};


// ======================================================
// TECLADO
// ======================================================

const keys = {};


window.addEventListener(
    "keydown",
    function(e) {

        const key =
            e.key.toLowerCase();

        keys[key] = true;


        if (key === "r") {

            reload();
        }


        if (key === "e") {

            dropBomb();
        }
    }
);


window.addEventListener(
    "keyup",
    function(e) {

        keys[
            e.key.toLowerCase()
        ] = false;
    }
);


canvas.addEventListener(
    "mousemove",
    function(e) {

        mouse.x = e.clientX;

        mouse.y = e.clientY;
    }
);


canvas.addEventListener(
    "mousedown",
    function() {

        mouse.down = true;
    }
);


canvas.addEventListener(
    "mouseup",
    function() {

        mouse.down = false;
    }
);


// ======================================================
// BALAS
// ======================================================

const bullets = [];


// ======================================================
// ZUMBIS
// ======================================================

const zombies = [];


// ======================================================
// BOSS
// ======================================================

const boss = {

    x: 0,

    y: 0,

    radius: 45,

    health: 500,

    maxHealth: 500,

    speed: 0.8,

    active: false,

    attackCooldown: 120
};


// ======================================================
// ÁCIDO
// ======================================================

const acidProjectiles = [];


// ======================================================
// BOMBAS
// ======================================================

const bombs = [];


const bombSettings = {

    maxBombs: 3,

    explosionRadius: 110,

    fuseTime: 90,

    cooldown: 0
};


// ======================================================
// VARIÁVEIS
// ======================================================

let score = 0;

let wave = 1;

let gameRunning = true;

let spawnTimer = 0;


// ======================================================
// DISTÂNCIA
// ======================================================

function distance(a, b) {

    return Math.hypot(

        a.x - b.x,

        a.y - b.y
    );
}


// ======================================================
// POSIÇÃO NAS BORDAS
// ======================================================

function randomEdgePosition() {

    const side =
        Math.floor(
            Math.random() * 4
        );


    if (side === 0) {

        return {

            x:
                Math.random() *
                canvas.width,

            y: -50
        };
    }


    if (side === 1) {

        return {

            x:
                canvas.width + 50,

            y:
                Math.random() *
                canvas.height
        };
    }


    if (side === 2) {

        return {

            x:
                Math.random() *
                canvas.width,

            y:
                canvas.height + 50
        };
    }


    return {

        x: -50,

        y:
            Math.random() *
            canvas.height
    };
}


// ======================================================
// CRIAR ZUMBI
// ======================================================

function spawnZombie() {

    const position =
        randomEdgePosition();


    const zombieHealth =
        2 +
        Math.floor(
            wave / 3
        );


    zombies.push({

        x: position.x,

        y: position.y,

        radius: 17,

        speed:
            0.7 +
            wave * 0.06,

        health:
            zombieHealth,

        maxHealth:
            zombieHealth,

        attackCooldown: 0
    });
}


// ======================================================
// CRIAR BOSS
// ======================================================

function spawnBoss() {

    if (boss.active)
        return;


    const position =
        randomEdgePosition();


    boss.x =
        position.x;


    boss.y =
        position.y;


    boss.health =
        boss.maxHealth;


    boss.active =
        true;


    boss.attackCooldown =
        120;


    document.getElementById(
        "bossBar"
    ).style.display =
        "block";
}


// ======================================================
// ATIRAR
// ======================================================

function shoot() {

    if (!gameRunning)
        return;


    if (
        player.shootCooldown > 0
    )
        return;


    if (
        player.reloadTime > 0
    )
        return;


    if (
        player.ammo <= 0
    ) {

        reload();

        return;
    }


    player.ammo--;

    player.shootCooldown =
        12;


    const angle =
        Math.atan2(

            mouse.y -
            player.y,

            mouse.x -
            player.x
        );


    bullets.push({

        x:
            player.x +
            Math.cos(angle) *
            22,

        y:
            player.y +
            Math.sin(angle) *
            22,

        dx:
            Math.cos(angle) *
            12,

        dy:
            Math.sin(angle) *
            12,

        radius: 4,

        life: 70
    });
}


// ======================================================
// RECARREGAR
// ======================================================

function reload() {

    if (
        player.reloadTime > 0
    )
        return;


    if (
        player.ammo >=
        player.maxAmmo
    )
        return;


    player.reloadTime =
        80;
}


// ======================================================
// SOLTAR BOMBA
// ======================================================

function dropBomb() {

    if (!gameRunning)
        return;


    if (
        bombSettings.cooldown > 0
    )
        return;


    if (
        bombs.length >=
        bombSettings.maxBombs
    )
        return;


    bombs.push({

        x: player.x,

        y: player.y,

        radius: 12,

        fuse:
            bombSettings.fuseTime,

        exploded: false,

        explosionTime: 0
    });


    bombSettings.cooldown =
        30;
}


// ======================================================
// ATUALIZAR JOGADOR
// ======================================================

function updatePlayer() {

    let dx = 0;

    let dy = 0;


    if (
        keys["w"] ||
        keys["arrowup"]
    ) {

        dy--;
    }


    if (
        keys["s"] ||
        keys["arrowdown"]
    ) {

        dy++;
    }


    if (
        keys["a"] ||
        keys["arrowleft"]
    ) {

        dx--;
    }


    if (
        keys["d"] ||
        keys["arrowright"]
    ) {

        dx++;
    }


    if (
        dx !== 0 ||
        dy !== 0
    ) {

        const length =
            Math.hypot(
                dx,
                dy
            );


        dx /= length;

        dy /= length;


        player.x +=
            dx *
            player.speed;


        player.y +=
            dy *
            player.speed;
    }


    player.x =
        Math.max(

            player.radius,

            Math.min(

                canvas.width -
                player.radius,

                player.x
            )
        );


    player.y =
        Math.max(

            player.radius,

            Math.min(

                canvas.height -
                player.radius,

                player.y
            )
        );


    if (
        player.shootCooldown > 0
    ) {

        player.shootCooldown--;
    }


    if (
        player.reloadTime > 0
    ) {

        player.reloadTime--;


        if (
            player.reloadTime === 0
        ) {

            player.ammo =
                player.maxAmmo;
        }
    }


    if (mouse.down) {

        shoot();
    }
}


// ======================================================
// ATUALIZAR BALAS
// ======================================================

function updateBullets() {

    for (
        let i =
            bullets.length - 1;

        i >= 0;

        i--
    ) {

        const bullet =
            bullets[i];


        bullet.x +=
            bullet.dx;


        bullet.y +=
            bullet.dy;


        bullet.life--;


        if (

            bullet.life <= 0 ||

            bullet.x < 0 ||

            bullet.x >
                canvas.width ||

            bullet.y < 0 ||

            bullet.y >
                canvas.height

        ) {

            bullets.splice(i, 1);

            continue;
        }


        let hitZombie =
            false;


        for (
            let j =
                zombies.length - 1;

            j >= 0;

            j--
        ) {

            const zombie =
                zombies[j];


            if (
                distance(
                    bullet,
                    zombie
                ) <
                bullet.radius +
                zombie.radius
            ) {

                zombie.health--;


                bullets.splice(i, 1);


                hitZombie =
                    true;


                if (
                    zombie.health <= 0
                ) {

                    zombies.splice(
                        j,
                        1
                    );


                    score += 10;


                    wave =
                        Math.floor(
                            score / 100
                        ) + 1;
                }


                break;
            }
        }


        if (hitZombie)
            continue;


        if (boss.active) {

            if (
                distance(
                    bullet,
                    boss
                ) <
                bullet.radius +
                boss.radius
            ) {

                boss.health -=
                    10;


                bullets.splice(
                    i,
                    1
                );


                if (
                    boss.health <= 0
                ) {

                    defeatBoss();
                }
            }
        }
    }
}


// ======================================================
// ATUALIZAR ZUMBIS
// ======================================================

function updateZombies() {

    for (
        const zombie of zombies
    ) {

        const angle =
            Math.atan2(

                player.y -
                zombie.y,

                player.x -
                zombie.x
            );


        zombie.x +=
            Math.cos(angle) *
            zombie.speed;


        zombie.y +=
            Math.sin(angle) *
            zombie.speed;


        const dist =
            distance(
                player,
                zombie
            );


        if (
            dist <
            player.radius +
            zombie.radius +
            3
        ) {

            if (
                zombie.attackCooldown <=
                0
            ) {

                player.health -=
                    8;


                zombie.attackCooldown =
                    45;
            }
        }


        if (
            zombie.attackCooldown > 0
        ) {

            zombie.attackCooldown--;
        }
    }
}


// ======================================================
// ATUALIZAR BOSS
// ======================================================

function updateBoss() {

    if (!boss.active)
        return;


    const angle =
        Math.atan2(

            player.y -
            boss.y,

            player.x -
            boss.x
        );


    boss.x +=
        Math.cos(angle) *
        boss.speed;


    boss.y +=
        Math.sin(angle) *
        boss.speed;


    if (
        boss.attackCooldown > 0
    ) {

        boss.attackCooldown--;
    }


    if (
        boss.attackCooldown <= 0
    ) {

        shootAcid();

        boss.attackCooldown =
            100;
    }


    const dist =
        distance(
            player,
            boss
        );


    if (
        dist <
        player.radius +
        boss.radius
    ) {

        player.health -= 2;
    }


    const percentage =
        Math.max(
            0,
            boss.health /
            boss.maxHealth
        ) * 100;


    document.getElementById(
        "bossHealth"
    ).style.width =
        percentage + "%";
}


// ======================================================
// DERROTAR BOSS
// ======================================================

function defeatBoss() {

    boss.active =
        false;


    score +=
        500;


    wave++;


    player.ammo =
        player.maxAmmo;


    acidProjectiles.length =
        0;


    document.getElementById(
        "bossBar"
    ).style.display =
        "none";
}


// ======================================================
// ÁCIDO
// ======================================================

function shootAcid() {

    const angle =
        Math.atan2(

            player.y -
            boss.y,

            player.x -
            boss.x
        );


    acidProjectiles.push({

        x: boss.x,

        y: boss.y,

        dx:
            Math.cos(angle) *
            5,

        dy:
            Math.sin(angle) *
            5,

        radius: 10,

        life: 120
    });
}


// ======================================================
// ATUALIZAR ÁCIDO
// ======================================================

function updateAcid() {

    for (
        let i =
            acidProjectiles.length - 1;

        i >= 0;

        i--
    ) {

        const acid =
            acidProjectiles[i];


        acid.x +=
            acid.dx;


        acid.y +=
            acid.dy;


        acid.life--;


        if (
            distance(
                acid,
                player
            ) <
            acid.radius +
            player.radius
        ) {

            player.health -=
                15;


            acidProjectiles.splice(
                i,
                1
            );


            continue;
        }


        if (

            acid.life <= 0 ||

            acid.x < -50 ||

            acid.x >
                canvas.width + 50 ||

            acid.y < -50 ||

            acid.y >
                canvas.height + 50

        ) {

            acidProjectiles.splice(
                i,
                1
            );
        }
    }
}


// ======================================================
// ATUALIZAR BOMBAS
// ======================================================

function updateBombs() {

    if (
        bombSettings.cooldown > 0
    ) {

        bombSettings.cooldown--;
    }


    for (
        let i =
            bombs.length - 1;

        i >= 0;

        i--
    ) {

        const bomb =
            bombs[i];


        if (
            !bomb.exploded
        ) {

            bomb.fuse--;


            if (
                bomb.fuse <= 0
            ) {

                explodeBomb(
                    bomb
                );


                bomb.exploded =
                    true;


                bomb.explosionTime =
                    20;
            }

        } else {

            bomb.explosionTime--;


            if (
                bomb.explosionTime <= 0
            ) {

                bombs.splice(
                    i,
                    1
                );
            }
        }
    }
}


// ======================================================
// EXPLOSÃO
// ======================================================

function explodeBomb(bomb) {

    const radius =
        bombSettings
            .explosionRadius;


    for (
        let i =
            zombies.length - 1;

        i >= 0;

        i--
    ) {

        const zombie =
            zombies[i];


        const dist =
            distance(
                bomb,
                zombie
            );


        if (
            dist <= radius
        ) {

            const damage =
                Math.max(

                    5,

                    50 *
                    (
                        1 -
                        dist /
                        radius
                    )
                );


            zombie.health -=
                damage;


            if (
                zombie.health <= 0
            ) {

                zombies.splice(
                    i,
                    1
                );


                score +=
                    10;
            }
        }
    }


    if (boss.active) {

        const dist =
            distance(
                bomb,
                boss
            );


        if (
            dist <= radius
        ) {

            const damage =
                Math.max(

                    10,

                    100 *
                    (
                        1 -
                        dist /
                        radius
                    )
                );


            boss.health -=
                damage;


            if (
                boss.health <= 0
            ) {

                defeatBoss();
            }
        }
    }
}


// ======================================================
// SPAWN
// ======================================================

function updateSpawning() {

    if (
        wave >= 5 &&
        !boss.active
    ) {

        spawnBoss();
    }


    spawnTimer--;


    if (
        spawnTimer <= 0
    ) {

        spawnZombie();


        const difficulty =
            Math.max(

                15,

                70 -
                wave * 4
            );


        spawnTimer =
            difficulty;
    }
}


// ======================================================
// DESENHAR JOGADOR
// ======================================================

function drawPlayer() {

    const angle =
        Math.atan2(

            mouse.y -
            player.y,

            mouse.x -
            player.x
        );


    // Personagem

    if (
        personagemImg.complete &&
        personagemImg.naturalWidth > 0
    ) {

        const tamanho =
            player.radius * 3;


        ctx.drawImage(

            personagemImg,

            player.x -
                tamanho / 2,

            player.y -
                tamanho / 2,

            tamanho,

            tamanho
        );

    } else {

        ctx.fillStyle =
            "#3498db";


        ctx.beginPath();


        ctx.arc(

            player.x,

            player.y,

            player.radius,

            0,

            Math.PI * 2
        );


        ctx.fill();
    }


    // Pistola

    if (
        pistolaImg.complete &&
        pistolaImg.naturalWidth > 0
    ) {

        ctx.save();


        ctx.translate(

            player.x,

            player.y
        );


        ctx.rotate(angle);


        const armaLargura =
            55;


        const armaAltura =
            30;


        ctx.drawImage(

            pistolaImg,

            10,

            -armaAltura / 2,

            armaLargura,

            armaAltura
        );


        ctx.restore();
    }


    // Mira

    ctx.strokeStyle =
        "rgba(255,255,255,0.7)";


    ctx.lineWidth =
        1;


    ctx.beginPath();


    ctx.arc(

        mouse.x,

        mouse.y,

        8,

        0,

        Math.PI * 2
    );


    ctx.stroke();
}


// ======================================================
// DESENHAR ZUMBIS
// ======================================================

function drawZombies() {

    for (
        const zombie of zombies
    ) {

        const tamanho =
            zombie.radius * 3;


        if (
            zombieImg.complete &&
            zombieImg.naturalWidth > 0
        ) {

            ctx.drawImage(

                zombieImg,

                zombie.x -
                    tamanho / 2,

                zombie.y -
                    tamanho / 2,

                tamanho,

                tamanho
            );

        } else {

            ctx.fillStyle =
                "#6c9b58";


            ctx.beginPath();


            ctx.arc(

                zombie.x,

                zombie.y,

                zombie.radius,

                0,

                Math.PI * 2
            );


            ctx.fill();
        }


        // Barra de vida

        ctx.fillStyle =
            "#300";


        ctx.fillRect(

            zombie.x - 17,

            zombie.y - 27,

            34,

            4
        );


        ctx.fillStyle =
            "#e53935";


        ctx.fillRect(

            zombie.x - 17,

            zombie.y - 27,

            34 *
            (
                zombie.health /
                zombie.maxHealth
            ),

            4
        );
    }
}


// ======================================================
// DESENHAR BOSS
// ======================================================

function drawBoss() {

    if (!boss.active)
        return;


    const tamanho =
        boss.radius * 3;


    ctx.save();


    // Brilho roxo do boss

    ctx.shadowColor =
        "#9c27b0";


    ctx.shadowBlur =
        25;


    // ==============================
    // USAR boss.webp
    // ==============================

    if (
        bossImg.complete &&
        bossImg.naturalWidth > 0
    ) {

        ctx.drawImage(

            bossImg,

            boss.x -
                tamanho / 2,

            boss.y -
                tamanho / 2,

            tamanho,

            tamanho
        );

    } else {

        // Desenho de emergência
        // caso boss.webp não carregue

        ctx.fillStyle =
            "#6a1b9a";


        ctx.beginPath();


        ctx.arc(

            boss.x,

            boss.y,

            boss.radius,

            0,

            Math.PI * 2
        );


        ctx.fill();
    }


    ctx.restore();
}


// ======================================================
// DESENHAR ÁCIDO
// ======================================================

function drawAcid() {

    for (
        const acid of acidProjectiles
    ) {

        ctx.fillStyle =
            "#76ff03";


        ctx.shadowColor =
            "#76ff03";


        ctx.shadowBlur =
            18;


        ctx.beginPath();


        ctx.arc(

            acid.x,

            acid.y,

            acid.radius,

            0,

            Math.PI * 2
        );


        ctx.fill();


        ctx.fillStyle =
            "#b2ff59";


        ctx.beginPath();


        ctx.arc(

            acid.x - 3,

            acid.y - 3,

            3,

            0,

            Math.PI * 2
        );


        ctx.fill();


        ctx.shadowBlur =
            0;
    }
}


// ======================================================
// DESENHAR BALAS
// ======================================================

function drawBullets() {

    for (
        const bullet of bullets
    ) {

        ctx.fillStyle =
            "#ffd54f";


        ctx.beginPath();


        ctx.arc(

            bullet.x,

            bullet.y,

            bullet.radius,

            0,

            Math.PI * 2
        );


        ctx.fill();
    }
}


// ======================================================
// DESENHAR BOMBAS
// ======================================================

function drawBombs() {

    for (
        const bomb of bombs
    ) {

        if (
            !bomb.exploded
        ) {

            ctx.fillStyle =
                "#111";


            ctx.beginPath();


            ctx.arc(

                bomb.x,

                bomb.y,

                bomb.radius,

                0,

                Math.PI * 2
            );


            ctx.fill();


            const blink =
                Math.floor(
                    bomb.fuse / 8
                ) % 2 === 0;


            ctx.fillStyle =
                blink
                    ? "#ff0000"
                    : "#ff9800";


            ctx.beginPath();


            ctx.arc(

                bomb.x,

                bomb.y - 8,

                4,

                0,

                Math.PI * 2
            );


            ctx.fill();


        } else {

            const progress =
                1 -
                bomb.explosionTime /
                20;


            const radius =
                bombSettings
                    .explosionRadius *
                progress;


            const gradient =
                ctx.createRadialGradient(

                    bomb.x,

                    bomb.y,

                    5,

                    bomb.x,

                    bomb.y,

                    radius
                );


            gradient.addColorStop(

                0,

                "rgba(255,255,220,1)"
            );


            gradient.addColorStop(

                0.25,

                "rgba(255,193,7,0.9)"
            );


            gradient.addColorStop(

                0.6,

                "rgba(255,87,34,0.7)"
            );


            gradient.addColorStop(

                1,

                "rgba(255,0,0,0)"
            );


            ctx.fillStyle =
                gradient;


            ctx.beginPath();


            ctx.arc(

                bomb.x,

                bomb.y,

                radius,

                0,

                Math.PI * 2
            );


            ctx.fill();
        }
    }
}


// ======================================================
// HUD
// ======================================================

function updateHUD() {

    document.getElementById(
        "health"
    ).textContent =
        Math.max(
            0,
            player.health
        );


    document.getElementById(
        "ammo"
    ).textContent =

        player.reloadTime > 0

            ? "RECARREGANDO..."

            : player.ammo;


    document.getElementById(
        "bombs"
    ).textContent =
        bombs.filter(
            bomb =>
                !bomb.exploded
        ).length;


    document.getElementById(
        "zombies"
    ).textContent =
        zombies.length;


    document.getElementById(
        "score"
    ).textContent =
        score;


    document.getElementById(
        "wave"
    ).textContent =
        wave;
}


// ======================================================
// GAME OVER
// ======================================================

function gameOver() {

    gameRunning =
        false;


    document.getElementById(
        "finalScore"
    ).textContent =
        score;


    document.getElementById(
        "gameOver"
    ).style.display =
        "flex";
}


// ======================================================
// REINICIAR
// ======================================================

function restartGame() {

    player.x =
        canvas.width / 2;


    player.y =
        canvas.height / 2;


    player.health =
        100;


    player.ammo =
        30;


    player.reloadTime =
        0;


    player.shootCooldown =
        0;


    bullets.length =
        0;


    zombies.length =
        0;


    acidProjectiles.length =
        0;


    bombs.length =
        0;


    score =
        0;


    wave =
        1;


    spawnTimer =
        0;


    boss.active =
        false;


    boss.health =
        boss.maxHealth;


    bombSettings.cooldown =
        0;


    document.getElementById(
        "bossBar"
    ).style.display =
        "none";


    gameRunning =
        true;


    document.getElementById(
        "gameOver"
    ).style.display =
        "none";
}


// ======================================================
// LOOP PRINCIPAL
// ======================================================

function gameLoop() {

    if (gameRunning) {

        updatePlayer();

        updateBullets();

        updateZombies();

        updateBoss();

        updateAcid();

        updateBombs();

        updateSpawning();


        if (
            player.health <= 0
        ) {

            gameOver();
        }
    }


    drawBackground();

    drawBullets();

    drawAcid();

    drawBombs();

    drawZombies();

    drawBoss();

    drawPlayer();

    updateHUD();


    requestAnimationFrame(
        gameLoop
    );
}


// ======================================================
// INICIAR
// ======================================================

gameLoop();

</script>
